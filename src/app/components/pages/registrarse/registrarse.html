<div class="registro-container">
  <h2 id="titulo-registro">Formulario de Registro</h2>

  <form (ngSubmit)="onSubmit()"
        aria-labelledby="titulo-registro"
        novalidate>

    <span class="leyenda-obligatorio">
      Los campos marcados con <span class="campo-obligatorio">*</span> son obligatorios.
    </span>

    <div class="form-group">
      <label for="nombre">Nombre: <span class="campo-obligatorio" aria-label="obligatorio">*</span></label>
      <input type="text" id="nombre" [(ngModel)]="usuario.nombre" name="nombre"
             required placeholder="Introduce tu nombre"
             autocomplete="given-name" aria-required="true">
    </div>

    <div class="form-group">
      <label for="apellido">Apellido: <span class="campo-obligatorio" aria-label="obligatorio">*</span></label>
      <input type="text" id="apellido" [(ngModel)]="usuario.apellido" name="apellido"
             required placeholder="Introduce tu apellido"
             autocomplete="family-name" aria-required="true">
    </div>

    <div class="form-group">
      <label for="email">Correo Electrónico: <span class="campo-obligatorio" aria-label="obligatorio">*</span></label>
      <input type="email" id="email" [(ngModel)]="usuario.email" name="email"
             required placeholder="Introduce tu correo electrónico"
             autocomplete="email" aria-required="true">
    </div>

    <div class="form-group">
      <label for="contrasenia">Contraseña: <span class="campo-obligatorio" aria-label="obligatorio">*</span></label>
      <input type="password"
             id="contrasenia"
             [(ngModel)]="usuario.contrasenia"
             name="contrasenia"
             required
             placeholder="Crea una contraseña"
             autocomplete="new-password"
             aria-required="true"
             aria-describedby="requisitos-pwd errores-pwd"
             [attr.aria-invalid]="usuario.contrasenia && passwordErrors.length > 0 ? 'true' : 'false'"
             (input)="validarContrasenia()">

      <!-- ACCESIBILIDAD: descripción estática siempre visible para lectores -->
      <p id="requisitos-pwd" class="password-hint">
        Mínimo 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial.
      </p>

      <!-- ACCESIBILIDAD: role="alert" anuncia los errores automáticamente -->
      <div id="errores-pwd"
           *ngIf="usuario.contrasenia && passwordErrors.length > 0"
           class="error-container"
           role="alert"
           aria-live="polite"
           aria-atomic="true">
        <p class="error-header">Requisitos pendientes:</p>
        <ul>
          <li *ngFor="let error of passwordErrors">{{ error }}</li>
        </ul>
      </div>

      <!-- ACCESIBILIDAD: confirma contraseña válida al lector -->
      <div *ngIf="usuario.contrasenia && passwordErrors.length === 0"
           class="success-inline"
           role="status"
           aria-live="polite">
           Contraseña segura
      </div>
    </div>

    <div class="form-group">
      <button type="submit" class="btn-submit">Registrarse</button>
    </div>

  </form>
</div>
