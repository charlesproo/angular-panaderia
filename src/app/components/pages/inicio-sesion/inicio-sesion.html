<div class="registro-container">
  <h2 id="titulo-login">Iniciar Sesión</h2>

  <form (ngSubmit)="onLogin()"
        aria-labelledby="titulo-login"
        novalidate>

    <span class="leyenda-obligatorio">
      Los campos marcados con <span class="campo-obligatorio">*</span> son obligatorios.
    </span>

    <div class="form-group">
      <label for="email">
        Correo Electrónico: <span class="campo-obligatorio" aria-label="obligatorio">*</span>
      </label>
      <input type="email"
             id="email"
             [(ngModel)]="loginData.email"
             name="email"
             required
             placeholder="Introduce tu correo electrónico"
             autocomplete="email"
             aria-required="true"
             [attr.aria-invalid]="errorMessage ? 'true' : 'false'">
    </div>

    <div class="form-group">
      <label for="contrasena">
        Contraseña: <span class="campo-obligatorio" aria-label="obligatorio">*</span>
      </label>
      <input type="password"
             id="contrasena"
             [(ngModel)]="loginData.password"
             name="contrasena"
             required
             placeholder="Introduce tu contraseña"
             autocomplete="current-password"
             aria-required="true"
             [attr.aria-invalid]="errorMessage ? 'true' : 'false'">
    </div>

    <div class="form-group">
      <!-- USABILIDAD: <button> en lugar de input[type=submit] -->
      <button type="submit" class="btn-submit">Iniciar Sesión</button>
    </div>

    <!-- ACCESIBILIDAD: role="alert" para que el lector anuncie el error automáticamente -->
    <div *ngIf="errorMessage"
         class="error-message"
         role="alert"
         aria-live="assertive"
         aria-atomic="true">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage"
         class="success-message"
         role="status"
         aria-live="polite"
         aria-atomic="true">
      {{ successMessage }}
    </div>

  </form>
</div>
