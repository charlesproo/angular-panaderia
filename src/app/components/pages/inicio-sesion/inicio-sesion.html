<div class="registro-container">
  <h2>Iniciar Sesión</h2>
  <form (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" [(ngModel)]="loginData.email" name="email" required placeholder="Introduce tu correo electrónico">
    </div>
    <div class="form-group">
      <label for="contrasena">Contraseña:</label>
      <input type="password" id="contrasena" [(ngModel)]="loginData.password" name="contrasena" required placeholder="Introduce tu contraseña">
    </div>
    <div class="form-group">
      <input type="submit" value="Iniciar Sesión">
    </div>
    <!-- Mensaje de validación -->
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>
  </form>
</div>
